name: Optional Supabase heartbeat via Actions
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: supabase-heartbeat
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .heartbeat-state
          key: heartbeat-${{ github.run_id }}
          restore-keys: heartbeat-
      - name: Probe and notify on state change
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/heartbeat.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .heartbeat-state
          key: heartbeat-${{ github.run_id }}
